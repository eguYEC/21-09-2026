<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Desde que comenzó nuestra historia</title>
  <meta name="description" content="Un campo de flores amarillas flotando en el cielo, dedicado a un amor eterno." />

  <!-- Fuentes opcionales: si no cargan, el proyecto sigue funcionando con las fuentes del sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Italiana&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- ===================== CIELO Y FONDO ===================== -->
  <div class="sky" aria-hidden="true">
    <div class="sky-glow"></div>
    <div class="stars"></div>
    <div class="clouds-layer clouds-far"></div>
    <div class="clouds-layer clouds-mid"></div>
    <div class="clouds-layer clouds-near"></div>
    <div class="sun"></div>
  </div>

  <!-- Contenedores dinámicos generados por JS -->
  <div class="petals-layer" id="petalsLayer" aria-hidden="true"></div>
  <div class="sparkles-layer" id="sparklesLayer" aria-hidden="true"></div>
  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <main class="content">

    <header class="hero-text">
      <p class="eyebrow">06 de octubre de 2021 ❤️</p>
      <h1 class="title">¡Todo comenzó<br class="br-mobile"> con un baile!</h1>
    </header>

    <section class="counter-section" aria-live="polite">
      <div class="counter" id="loveCounter">
        <div class="counter-unit">
          <span class="counter-number" id="years">00</span>
          <span class="counter-label">años</span>
        </div>
        <div class="counter-unit">
          <span class="counter-number" id="months">00</span>
          <span class="counter-label">meses</span>
        </div>
        <div class="counter-unit">
          <span class="counter-number" id="days">00</span>
          <span class="counter-label">días</span>
        </div>
        <div class="counter-unit">
          <span class="counter-number" id="hours">00</span>
          <span class="counter-label">horas</span>
        </div>
        <div class="counter-unit">
          <span class="counter-number" id="minutes">00</span>
          <span class="counter-label">minutos</span>
        </div>
      </div>
    </section>

    <p class="love-message">
      “Desde aquel día, el tiempo no solo ha pasado&hellip; ha escrito nuestra historia.”
    </p>

  </main>

  <!-- ===================== CAMPO DE FLORES ===================== -->
  <section class="field" id="flowerField" aria-label="Campo de flores amarillas">
    <!-- Las flores se generan dinámicamente con JavaScript -->
  </section>

  <script src="./js/script.js"></script>
</body>
</html>
